services:
  arbot:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BOT_MODE: ${BOT_MODE:-dashboard}
      BOT_DATA_DIR: /data
      PORT: 8080
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN}
      LIVE_KILL: ${LIVE_KILL:-1}
      DRY_RUN: ${DRY_RUN:-true}
      PMXT_API_KEY: ${PMXT_API_KEY:-}
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY:-}
      POLY_FUNDER: ${POLY_FUNDER:-}
      POLY_SIGNATURE_TYPE: ${POLY_SIGNATURE_TYPE:-3}
      KALSHI_KEY_ID: ${KALSHI_KEY_ID:-}
      KALSHI_PK: ${KALSHI_PK:-}
      POLYMARKET_URL: ${POLYMARKET_URL:-}
      KALSHI_URL: ${KALSHI_URL:-}
      TRADING_MODE: ${TRADING_MODE:-CONSERVATIVE}
      TRADE_AMOUNT_CENTS: ${TRADE_AMOUNT_CENTS:-100}
      MIN_PROFIT_CENTS: ${MIN_PROFIT_CENTS:-1}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    volumes:
      - arbot-data:/data

volumes:
  arbot-data:
