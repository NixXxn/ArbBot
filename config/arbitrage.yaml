# Arbot fee-aware YES/NO (Up/Down) arbitrage defaults — paper mode.
mode: paper
poll_interval_seconds: 5
starting_balance: 1000
min_position_usd: 2

arbitrage:
  max_pair_cost: 0.94
  min_edge: 0.025
  fee_buffer: 0.01
  safety_margin: 0.005
  taker_fee_rate: 0.01
  maker_fee_rate: 0.0
  slippage_buffer: 0.002
  min_liquidity: 400
  min_volume_24h: 150
  min_ask: 0.02
  max_ask: 0.95
  min_ask_size: 3.0
  position_usd: 45.0
  max_position_usd: 110.0
  max_open_pairs: 8
  max_unpaired_notional: 45.0
  max_unpaired_loss: 0.02
  max_capital_locked: 500.0
  hedge_timeout_seconds: 120
  max_quote_age_ms: 2000
  min_pair_profit_pct: 0.005
  pair_bid_sum_exit: 0.99
  scan_limit: 250
  prefer_crypto_weather: true
  maker_tick: 0.01
