# Arbot defaults — paper path aligned with polymarket-papertrader arbitrage.
mode: paper
poll_interval_seconds: 2
starting_balance: 1000
min_position_usd: 2

arbitrage:
  max_pair_cost: 0.94
  max_maker_ask_sum: 1.04
  paper_taker_cap: 0.995
  paper_mode: true
  paper_fak: true
  paper_relax_fees: true
  min_edge: 0.025
  fee_buffer: 0.01
  safety_margin: 0.005
  taker_fee_rate: 0.01
  maker_fee_rate: 0.0
  slippage_buffer: 0.002
  min_liquidity: 400
  min_volume_24h: 150
  min_ask: 0.01
  max_ask: 0.99
  min_ask_size: 3.0
  live_maker_enabled: false
  live_limit_timeout_seconds: 25
  hedge_depth_multiple: 1.0
  position_usd: 45.0
  max_position_usd: 110.0
  max_open_pairs: 8
  max_unpaired_notional: 90.0
  max_concurrent_unpaired: 4
  max_unpaired_loss: 0.02
  max_capital_locked: 500.0
  hedge_timeout_seconds: 120
  max_quote_age_ms: 5000
  min_pair_profit_pct: 0.005
  pair_bid_sum_exit: 0.99
  scan_limit: 250
  prefer_crypto_weather: false
  maker_tick: 0.01
  immediate_hedge: true
