# Polymarket ↔ Kalshi cross-venue arbitrage (paper by default).
cross_venue:
  min_edge: 0.03
  fee_buffer: 0.02
  max_pair_cost: 0.97
  position_usd: 25
  max_open_pairs: 4
  poll_interval_seconds: 5
  scan_limit_poly: 200
  scan_limit_kalshi: 400
  min_match_score: 0.78
  max_end_delta_hours: 72
  auto_match: true
  paper_mode: true
  # Optional explicit pairs (preferred over fuzzy match):
  # mapped_pairs:
  #   - poly_slug: will-fed-cut-rates-in-october
  #     kalshi_ticker: KXFED-24OCT-T25
  #     aligned: true
  mapped_pairs: []
